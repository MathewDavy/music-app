<button
  class="button-common"
  id="select-key"
  mat-raised-button
  [matMenuTriggerFor]="menu"
>
  {{ keyService.currentKey }}
</button>
<mat-menu #menu="matMenu">
  @for (key of keyService.keysArray; track key) {
  <button mat-menu-item (click)="setKey(key)">{{ key }}</button>

  }
</mat-menu>
