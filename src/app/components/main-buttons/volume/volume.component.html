<div class="parent-div">
  <label class="icon-div">
   

    <svg volume></svg>
  </label>
  <!-- </label> -->
  <div class="slider-div">
    <mat-slider
      id="volume"
      thumbLabel
      [displayWith]="onChange"
      (input)="onChange($event.value)"
      color="primary"
      min="0"
      max="100"
      step="1"
      ><input matSliderThumb [value]="sliderPos" />
    </mat-slider>
  </div>
</div>
