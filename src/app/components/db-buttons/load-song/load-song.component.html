

<div class="load-grid-container">
  @if (song) {
  <p>{{song.name}}</p>
  }
  <button
  class="button-common"
  mat-raised-button
  [matMenuTriggerFor]="menu"
>
 Load melody
</button>
<mat-menu #menu="matMenu">
  @for (song of dbService.songs; track song) {
  <button mat-menu-item (click)="loadSong(song.id)">{{ song.name }}</button>

  }
</mat-menu>

</div>
